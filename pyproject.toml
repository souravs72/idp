[project]
name = "idp"
authors = [
    { name = "Sanjay Kumar", email = "sanjay.kumar001@gmail.com"}
]
description = "The IDP subsystem extracts structured data from uploaded documents and creates ERPNext records from the extracted data."
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # "frappe~=16.0.0" # Installed and managed by bench.
    "pypdf>=4.0",
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "Pillow",
    "paddleocr",
    # LLM provider SDKs — promoted to core deps so `bench setup
    # requirements` always installs them. Each provider remains
    # opt-in at runtime via IDP Settings; the SDK import is lazy
    # so missing one only matters if you actually pick that provider.
    "openai>=1.40",
    "tiktoken>=0.7",
    "anthropic>=0.34",
    # Phase 24 — fast fuzzy matching for Item/Account candidate ranking.
    # Falls back to stdlib difflib when not installed, so this stays a
    # soft requirement at runtime.
    "rapidfuzz>=3.0",
]

[project.optional-dependencies]
# Kept for users who still want to opt-into individual providers.
# Ollama uses httpx (already shipped with Frappe).
llm-openai = ["openai>=1.40", "tiktoken>=0.7"]
llm-anthropic = ["anthropic>=0.34"]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

# These dependencies are only installed when developer mode is enabled
[tool.bench.dev-dependencies]
# package_name = "~=1.1.0"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "I",
    "UP",
    "B",
    "RUF",
]
ignore = [
    "B017", # assertRaises(Exception) - should be more specific
    "B018", # useless expression, not assigned to anything
    "B023", # function doesn't bind loop variable - will have last iteration's value
    "B904", # raise inside except without from
    "E101", # indentation contains mixed spaces and tabs
    "E402", # module level import not at top of file
    "E501", # line too long
    "E741", # ambiguous variable name
    "F401", # "unused" imports
    "F403", # can't detect undefined names from * import
    "F405", # can't detect undefined names from * import
    "F722", # syntax error in forward type annotation
    "W191", # indentation contains tabs
    "UP030", # Use implicit references for positional format fields (translations)
    "UP031", # Use format specifiers instead of percent format
    "UP032", # Use f-string instead of `format` call (translations)
    "UP037", # quoted annotations
    "UP040", # Use type aliases instead of type annotations
]
typing-modules = ["frappe.types.DF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true
